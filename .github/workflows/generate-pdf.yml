name: Translate (Claude) and Generate CV PDF

on:
  push:
    paths:
      # 1. The workflow ONLY starts if a markdown CV is pushed
      - '**/*_ES.md'
      - '**/*_ES.MD'
      - '**/*_EN.md'
      - '**/*_EN.MD'     
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        # Fetch depth 0 is required for the changed-files action to compare commits correctly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install anthropic
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-xetex

      - name: Identify exactly which ES files changed
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          # FILTER BY SPANISH CV MARKDOWN FILES
          files: |
            **/*_ES.md
            **/*_ES.MD

      - name: Translate ONLY modified Spanish CVs via Claude
        # 2. Only run this step if an ES file was actually changed
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        # 3. Pass only the specific files to Python, preventing wasteful token burn
        run: python .github/scripts/translate_cv.py ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Convert Markdown to PDF
        run: |
          mkdir -p PDF
          
          find . -maxdepth 1 -type f -iname "CV_*.md" | while read -r file; do
            filename=$(basename "$file")
            name="${filename%.*}"
            
            pandoc "$file" -o "PDF/${name}_AUTO.pdf" --pdf-engine=xelatex
          done

      - name: Commit and push translated MD and PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-translate modified CVs and update PDFs"