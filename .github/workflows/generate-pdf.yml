name: Translate (Claude) and Generate CV PDF

on:
  push:
    paths:
      # 1. The workflow ONLY starts if a markdown CV is pushed
      - '**/*_ES.md'
      - '**/*_ES.MD'
      - '**/*_EN.md'
      - '**/*_EN.MD'     
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        # Fetch depth 0 is required for the changed-files action to compare commits correctly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install anthropic
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-xetex

      - name: Identify exactly which CV files changed
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          # Track BOTH Spanish and English files so Pandoc knows about them
          files: |
            **/*_ES.md
            **/*_ES.MD
            **/*_EN.md
            **/*_EN.MD

      - name: Translate ONLY modified Spanish CVs via Claude
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # Only pass the _ES files to Python to protect your API tokens!
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == *"_ES.MD" ]] || [[ "$file" == *"_ES.md" ]]; then
              python .github/scripts/translate_cv.py "$file"
            fi
          done

      - name: Convert Markdown to PDF
        run: |
          mkdir -p PDF
          
          # Loop exclusively through the files that were modified in this commit
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            
            # 1. Convert the modified file (ES or EN)
            filename=$(basename "$file")
            name="${filename%.*}"
            pandoc "$file" -o "PDF/${name}_AUTO.pdf" --pdf-engine=xelatex
            
            # 2. If the modified file was ES, also convert its newly translated EN counterpart
            if [[ "$file" == *"_ES.MD" ]] || [[ "$file" == *"_ES.md" ]]; then
              en_file="${file/_ES.MD/_EN.MD}"
              en_file="${en_file/_ES.md/_EN.md}"
              
              if [ -f "$en_file" ]; then
                en_filename=$(basename "$en_file")
                en_name="${en_filename%.*}"
                pandoc "$en_file" -o "PDF/${en_name}_AUTO.pdf" --pdf-engine=xelatex
              fi
            fi
          done

      - name: Commit and push translated MD and PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-translate modified CVs and update PDFs"